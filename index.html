/* ============================================================
   pages/search.js — 全站搜索（组织/时间轴/设定集/档案/广场）
   ============================================================ */
(function (SF) {
  'use strict';
  SF.pages = SF.pages || {};

  var U = SF.ui, S = SF.store, R = SF.router;
  var el = U.el, icon = U.icon, esc = U.esc;

  function buildIndex() {
    var w = S.world() || {};
    var idx = [];

    (w.orgs || []).forEach(function (o) {
      idx.push({
        type: '组织', title: o.name,
        sub: [o.en, o.slogan, (o.tags || []).join(' ')].filter(Boolean).join(' · '),
        route: '#/orgs/' + o.id,
        hay: [o.name, o.en, o.slogan, o.desc, (o.tags || []).join(' ')].join(' ')
      });
    });

    (w.timeline || []).forEach(function (t) {
      idx.push({
        type: '时间轴', title: t.title,
        sub: t.tag || '',
        route: '#/timeline/' + t.id,
        hay: [t.title, t.desc, t.tag, t.era].join(' ')
      });
    });

    (w.codex || []).forEach(function (c) {
      idx.push({
        type: '设定集', title: c.title,
        sub: (c.tags || []).join(' '),
        route: '#/codex/' + c.id,
        hay: [c.title, c.body, (c.tags || []).join(' ')].join(' ')
      });
    });

    (w.archives || []).forEach(function (a) {
      if (a.status === 'pending') return;
      idx.push({
        type: '档案', title: a.name,
        sub: a.bio || '',
        route: '#/archives/' + a.id,
        hay: [a.name, a.bio, a.faction].join(' ')
      });
    });

    (S.posts() || []).forEach(function (p) {
      idx.push({
        type: '广场', title: '',
        sub: p.text || '',
        route: '#/square',
        hay: p.text || ''
      });
    });

    return idx;
  }

  function match(idx, q) {
    q = (q || '').trim().toLowerCase();
    if (!q) return [];
    return idx.filter(function (it) { return (it.hay || '').toLowerCase().indexOf(q) >= 0; });
  }

  function render(mount, ctx) {
    var q = (ctx.query && ctx.query.q) || '';
    var idx = buildIndex();

    var input = el('input', { class: 'input search-input', type: 'search',
      placeholder: '搜索组织、时间轴、设定、档案、广场留言…', value: q });
    var results = el('div', { class: 'mt16' });

    function paint(list) {
      results.innerHTML = '';
      if (!q.trim()) {
        results.appendChild(el('div', { class: 'muted center', style: { padding: '48px 0' }, text: '输入关键词开始搜索' }));
        return;
      }
      if (!list.length) {
        results.appendChild(el('div', { class: 'muted center', style: { padding: '48px 0' }, text: '没有找到与「' + q + '」相关的内容' }));
        return;
      }
      var groups = {};
      list.forEach(function (it) { (groups[it.type] = groups[it.type] || []).push(it); });
      Object.keys(groups).forEach(function (type) {
        results.appendChild(el('div', { class: 'section-head', style: { marginTop: '10px' } },
          [el('h3', { text: type + ' · ' + groups[type].length })]));
        groups[type].forEach(function (it) {
          results.appendChild(el('a', { class: 'search-item', href: it.route }, [
            el('div', { class: 'si-type', text: type }),
            el('div', { class: 'si-body' }, [
              it.title ? el('div', { class: 'si-title', text: it.title }) : null,
              it.sub ? el('div', { class: 'si-sub', text: it.sub }) : null
            ].filter(Boolean))
          ]));
        });
      });
    }

    input.addEventListener('input', function () {
      q = input.value;
      try { history.replaceState(null, '', R.url('/search', { q: q })); } catch (e) {}
      paint(match(idx, q));
    });

    mount.appendChild(el('div', { class: 'search-bar' }, [
      el('span', { class: 'search-ico', html: icon('search', 18) }),
      input
    ]));
    mount.appendChild(results);
    paint(match(idx, q));
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 50);
  }

  SF.pages.search = { render: render };
})(window.SF);

/* ============================================================
   pages/notices.js — 通知中心（回复 / 点赞 / 审核）
   ============================================================ */
(function (SF) {
  'use strict';
  SF.pages = SF.pages || {};

  var U = SF.ui, S = SF.store, R = SF.router;
  var el = U.el, icon = U.icon, esc = U.esc;

  function timeAgo(t) {
    if (!t) return '';
    var d = new Date(t), s = (Date.now() - d.getTime()) / 1000;
    if (isNaN(s)) return '';
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 7) return Math.floor(s / 86400) + ' 天前';
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function emptyState(title, sub) {
    return el('div', { class: 'empty empty-sm' }, [
      el('div', { class: 'i', html: icon('bell', 26) }),
      el('p', { text: title }),
      sub ? el('div', { class: 'sub', text: sub }) : null
    ].filter(Boolean));
  }

  function target(n) {
    if (n.ref_type === 'post') return '#/square';
    if (n.ref_type === 'archive') return '#/archives/' + n.ref_id;
    return '#/home';
  }

  function render(mount) {
    SF.app.setTitle('通知');
    var box = el('div', {});
    mount.appendChild(box);
    load();

    function load() {
      box.innerHTML = '';
      if (!S.isCloud()) {
        box.appendChild(emptyState('未登录云端', '登录后可接收回复、点赞与审核通知'));
        return;
      }
      SF.cloud.listNotifications().then(function (list) {
        if (!list || !list.length) {
          box.appendChild(emptyState('暂时没有通知'));
          SF.cloud.markAllRead().catch(function () {});
          if (SF.app.refreshBell) SF.app.refreshBell();
          return;
        }
        list.forEach(function (n) {
          box.appendChild(el('a', { class: 'notice-item ' + (n.read ? 'read' : 'unread'), href: target(n) }, [
            el('div', { class: 'notice-dot' }),
            el('div', { class: 'grow' }, [
              el('div', { class: 'ni-title', html: esc(n.text || '') }),
              el('div', { class: 'ni-time', text: timeAgo(n.created_at) })
            ])
          ]));
        });
        SF.cloud.markAllRead().catch(function () {});
        if (SF.app.refreshBell) SF.app.refreshBell();
      }).catch(function (e) {
        box.appendChild(emptyState('加载失败', e.message || ''));
      });
    }
  }

  SF.pages.notices = { render: render };
})(window.SF);

/* ============================================================
   pages/me.js — 个人中心（资料 / 我的档案 / 试炼历史）
   ============================================================ */
(function (SF) {
  'use strict';
  SF.pages = SF.pages || {};

  var U = SF.ui, S = SF.store, R = SF.router;
  var el = U.el, icon = U.icon, esc = U.esc, escLines = U.escLines;

  /* 访客档案审核状态变化（pending→public/private）时给出提示 */
  function checkReviewNotices() {
    try {
      var me = S.currentUser() || {};
      var seen = {};
      try { seen = JSON.parse(localStorage.getItem('_sf_arc_seen') || '{}'); } catch (e) {}
      var changed = [];
      S.allArchives().forEach(function (a) {
        if (a.author !== me.id) return;
        var prev = seen[a.id];
        if ((a.status === 'public' || a.status === 'private') && prev === 'pending') {
          changed.push(a.status === 'public' ? ('档案「' + a.name + '」已通过审核并公开') : ('档案「' + a.name + '」未通过审核，已被退回'));
        }
        seen[a.id] = a.status;
      });
      localStorage.setItem('_sf_arc_seen', JSON.stringify(seen));
      if (changed.length === 1) U.toast(changed[0], 'ok');
      else if (changed.length > 1) U.toast('有 ' + changed.length + ' 份档案的审核状态已更新', 'ok');
    } catch (e) { /* 忽略 */ }
  }

  function render(mount) {
    var w = S.world(), me = S.currentUser() || {}, admin = S.isAdmin();
    if (!me.id) return;
    // 拉取云端访客档案，确保「我的档案」包含跨设备提交的内容
    S.loadArchives().then(function () { checkReviewNotices(); R.resolve(); }).catch(function () {});

    /* ---- 资料卡 ---- */
    var org = me.faction ? SF.factionOf(me.faction) : null;
    var profile = el('section', { class: 'card card-pad row g16 wrap', style: { alignItems: 'center' } }, [
      SF.app.avatarEl(me, 64),
      el('div', { class: 'grow', style: { minWidth: 0 } }, [
        el('div', { class: 'row g8' }, [
          el('h2', { style: { fontSize: '20px', marginTop: '0' }, text: me.name }),
          admin ? el('span', { class: 'chip', style: { background: 'var(--primary-bg)', color: 'var(--primary)' }, text: '管理员' }) : null
        ].filter(Boolean)),
        el('div', { class: 'small muted', text: S.isCloud() ? '云端账号' + (me.email ? ' · ' + me.email : '') : '本机访客' }),
        org ? el('div', { class: 'row g8 mt6' }, [
          el('span', { class: 'chip chip-sm', style: { background: org.color + '14', color: org.color }, html: SF.emblem(org.key, 13) + '<span>' + esc(org.name) + '</span>' })
        ]) : null,
        me.bio ? el('div', { class: 'small dim mt8 clamp-2', text: me.bio }) : null
      ]),
      el('button', { class: 'btn btn-line btn-sm', html: icon('edit', 15) + '<span>编辑资料</span>', onclick: editProfile })
    ]);
    mount.appendChild(profile);

  /* 头像裁剪：选图后弹方形取景框，可拖动 + 缩放，输出头像 URL（云端上传 Storage，本地用 blob） */
  function openCropper(file, cb) {
    var img = new Image();
    img.onload = function () { buildCropperUI(img, cb); };
    img.onerror = function () { U.toast('图片读取失败', 'err'); };
    img.src = URL.createObjectURL(file);
  }

  function buildCropperUI(img, cb) {
    var SIZE = 280, RING = 200, OFF = 40, OUT = 240;
    var scale = Math.max(RING / img.width, RING / img.height) * 1.15;
    var tx = (SIZE - img.width * scale) / 2;
    var ty = (SIZE - img.height * scale) / 2;
    var elImg = el('img', { src: img.src, draggable: false });
    function apply() { elImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
    apply();

    var cropper = el('div', { class: 'cropper' }, [elImg, el('div', { class: 'crop-ring' })]);
    var dragging = false, lx = 0, ly = 0;
    cropper.addEventListener('pointerdown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; try { cropper.setPointerCapture(e.pointerId); } catch (x) {} });
    cropper.addEventListener('pointermove', function (e) { if (!dragging) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply(); });
    cropper.addEventListener('pointerup', function () { dragging = false; });
    cropper.addEventListener('pointercancel', function () { dragging = false; });

    var range = el('input', { type: 'range', min: '0.5', max: '4', step: '0.01', value: String(scale) });
    range.addEventListener('input', function () { scale = parseFloat(range.value); apply(); });

    function commit() {
      var cv = document.createElement('canvas'); cv.width = OUT; cv.height = OUT;
      var c = cv.getContext('2d');
      var sx = (OFF - tx) / scale, sy = (OFF - ty) / scale, sw = RING / scale;
      c.drawImage(img, sx, sy, sw, sw, 0, 0, OUT, OUT);
      cv.toBlob(function (blob) {
        if (!blob) { U.toast('裁剪失败', 'err'); return; }
        if (S.isCloud() && SF.cloud.auth.uid()) {
          var path = 'avatars/' + SF.cloud.auth.uid() + '/' + Date.now() + '.jpg';
          SF.cloud.storageUpload(blob, 'sf-media', path)
            .then(function (url) { cb(url); })
            .catch(function () { cb(URL.createObjectURL(blob)); });
        } else {
          cb(URL.createObjectURL(blob));
        }
      }, 'image/jpeg', 0.85);
    }

    var body = el('div', {}, [
      cropper,
      el('div', { class: 'crop-tools' }, [el('span', { class: 'small', text: '缩放' }), range]),
      el('div', { class: 'tiny muted center', style: { marginTop: '8px' }, text: '拖动调整位置，圆框内即为头像' })
    ]);
    U.modal({ title: '裁剪头像', body: body, buttons: [
      { text: '取消', class: 'btn-ghost', onclick: function (close) { close(); } },
      { text: '确定', class: 'btn-primary', onclick: function (close) { commit(); close(); } }
    ] });
  }

    }
    paintFace();

    var body = el('div', { class: 'col g14' }, [

          el('div', { class: 'tiny muted', text: '选图后可拖动缩放裁剪，圆形区域即头像。' }),
          el('div', { class: 'row g8 wrap' }, [
            el('button', { class: 'btn btn-line btn-sm', html: icon('image', 14) + '<span>上传并裁剪</span>',
              onclick: async function () {

        }
        U.toast('已保存', 'ok'); close(); R.resolve();
      } }
    ] });
  }

        s.regKey = regKeyI.value.trim();

      } }
    ] });
  }

  /* ---------------- 云端配置 ---------------- */
  function cloudCfg() {
    var cfg = (SF.cloud && SF.cloud.loadCfg && SF.cloud.loadCfg()) || {};
    var urlI = el('input', { class: 'input', value: cfg.url || '', placeholder: 'https://xxxx.supabase.co' });
    var keyI = el('input', { class: 'input', value: cfg.anonKey || '', placeholder: 'public anon key（仅本地保存）' });
    var body = el('div', { class: 'col g14' }, [
      el('div', { class: 'field' }, [el('label', { text: 'Supabase URL' }), urlI]),
      el('div', { class: 'field' }, [el('label', { text: 'Anon Key' }), keyI]),
      el('div', { class: 'hint', text: '配置后访客可注册账号、跨设备同步，并在管理台一键发布。密钥仅保存在本机浏览器中。' })
    ]);
    U.modal({ title: '云端配置', body: body, buttons: [
      { text: '取消', class: 'btn-line' },
      { text: '保存并测试', class: 'btn-primary', onclick: async function (close) {
        var url = urlI.value.trim(), key = keyI.value.trim();
        if (!url || !key) { U.toast('请填写完整', 'err'); return; }
        SF.cloud.saveCfg({ url: url, anonKey: key });
        try {
          var ok = await SF.cloud.ping();
          if (ok) { U.toast('连接成功', 'ok'); close(); R.resolve(); }
          else U.toast('连接失败，请检查配置与数据库表', 'err');
        } catch (e) { U.toast('连接失败：' + (e.message || ''), 'err'); }
      } }
    ] });
  }

  async function publish() {
    if (!S.isCloud()) { U.toast('请先在云端配置中填写 Supabase 信息', 'err'); return; }
    if (!S.isCloudAdmin()) {
      U.toast('发布需要云端管理员账号：请先通过「登录 / 注册账号」以管理员身份登录', 'err');
      return;
    }
    try { await S.push(); U.toast('已发布到云端', 'ok'); R.resolve(); }
    catch (e) { U.toast(e.message || '发布失败', 'err'); }
  }
  async function pull() {
    if (!S.isCloud()) { U.toast('未配置云端', 'err'); return; }
    try { await S.pull({ force: true }); U.toast('已获取最新内容', 'ok'); R.resolve(); }
    catch (e) { U.toast(e.message || '拉取失败', 'err'); }
  }

  function reject(a) {
    U.formModal({ title: '退回档案', okText: '退回', fields: [
      { name: 'reason', label: '退回理由（可选，会附在档案上）', type: 'textarea', rows: 3 }
    ] }).then(function (r) {
      if (!r) return;
      S.update('archives', a.id, { status: 'private', reviewNote: r.reason || '' });
      U.toast('已退回', 'ok'); R.resolve();
    });
  }

  /* ---------------- 导入导出 ---------------- */
  function exportAll() {
    U.download('starfall-world.json', S.exportWorld());
    U.toast('已导出全部数据', 'ok');
  }
  async function doImport() {
    var file = await U.pickFile('.json,application/json');
    if (!file) return;
    try {
      var text = await U.readFileText(file);
      var mode = await U.formModal({ title: '导入方式', okText: '导入', fields: [
        { name: 'mode', label: '选择导入策略', type: 'select',
          options: [{ value: 'merge', label: '合并（保留已有，仅新增缺失项）' }, { value: 'overwrite', label: '覆盖（以文件为准，重置全部）' }] }
      ] });
      if (!mode) return;
      S.importWorld(text, mode.mode === 'merge' ? 'merge' : undefined);
      U.toast('导入完成', 'ok'); R.resolve();
    } catch (e) { U.toast('导入失败：' + e.message, 'err'); }
  }
  async function doReset() {
    var ok = await U.confirm({ title: '重置世界观', message: '将恢复为初始种子数据，你所有的修改（组织、档案、题库等）都会丢失。此操作不可撤销。', danger: true, okText: '重置' });
    if (!ok) return;
    S.resetWorld(); U.toast('已重置为初始数据', 'ok'); R.resolve();
  }

  SF.pages.admin = { render: render };
})(window.SF);

/* === js/app.js === */
/* ============================================================
   app.js — 应用引导 / 外壳 / 路由注册 / 双模式

(function (SF) {

  var APP = document.getElementById('app');

  /* 导航定义 —— adminOnly 的项只在管理员模式显示 */
  var NAV = [
    { group: '浏览', items: [

    ]},

  /* ============================================================
     入口
     ============================================================ */
  /* 通知铃铛 */
  var bellBtns = [];
  function bellBtn() {
    var badge = el('span', { class: 'bell-badge', style: { display: 'none' }, text: '' });
    var btn = el('button', { class: 'btn btn-ghost btn-icon btn-sm bell-wrap', title: '通知', html: icon('bell', 18) });
    btn.appendChild(badge);
    btn._badge = badge;
    btn.onclick = function () { R.go('/notices'); };
    bellBtns.push(btn);
    return btn;
  }
  async function refreshBell() {
    if (!S.isCloud() || !SF.cloud.auth.uid()) { bellBtns.forEach(function (b) { b._badge.style.display = 'none'; }); return; }
    try {
      var n = await SF.cloud.unreadCount();
      bellBtns.forEach(function (b) {
        if (n > 0) { b._badge.style.display = ''; b._badge.textContent = n > 99 ? '99+' : String(n); }
        else b._badge.style.display = 'none';
      });
    } catch (e) {}
  }

  var booted = false;
  async function boot() {
    if (booted) return;
    booted = true;
    try {
      // 应用深色模式偏好（尽早，避免闪烁）
      try { if (localStorage.getItem('_sf_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}

      S.init();

      // 加载内置/已保存的云端配置（含打包时注入的 window.SF_CLOUD_DEFAULT）。
      // 必须最先调用，否则 isCloud() 永远为 false，云端入口不会出现。
      SF.cloud.loadCfg();

      // 云端：恢复会话
      if (S.isCloud()) {
        try {
          SF.cloud.loadSession();
          const user = await SF.cloud.auth.me();
          if (user) {
          await SF.cloud.loadProfile();
          refreshBell().catch(function () {});
          S.hydrateFromCloud(); // 拉取云端试炼历史等个人数据
            S.setMode(SF.cloud.isAdmin() ? 'admin' : 'guest');
            await tryClaimAdmin().catch(function () {}); // 注册时存了密钥则自动提权
          }
        } catch (e) { console.warn('session restore', e); }
        // 后台拉取最新世界数据（不打断用户）
        S.pull().catch(function () { /* 静默 */ });
      }

      if (!S.currentUser()) { renderGate(); maybeOnboard(); return; }
      renderShell(); maybeOnboard();
    } catch (err) {
      console.error('boot failed', err);
      var errEl = document.getElementById('gate-error');
      var loadEl = document.getElementById('gate-loading');
      if (loadEl) loadEl.style.display = 'none';
      if (errEl) {
        errEl.style.display = 'block';
        errEl.innerHTML = '<b>启动失败</b><br>' + U.esc(String(err && err.message ? err.message : err)) + '<br><small style="opacity:.7">' + U.esc(err && err.stack ? err.stack.split('\n').slice(1,3).join('\n') : '') + '</small>';
      }
    }
  }

  /* ============================================================
     Gate — 登记 / 登录
     ============================================================ */
  function renderGate(stage) {
    var w = S.world();
    APP.innerHTML = '';
    var card = el('div', { class: 'gate-card' });
    var gate = el('div', { class: 'gate' }, [card]);
    APP.appendChild(gate);

    var head = el('div', { style: { textAlign: 'center', marginBottom: '24px' } }, [
      el('div', { class: 'gate-logo', html: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/></svg>' }),
      el('div', { style: { fontSize: '20px', fontWeight: '800', letterSpacing: '.01em' }, text: w.site.title }),
      el('div', { class: 'muted', style: { fontSize: '11.5px', letterSpacing: '.18em', marginTop: '4px', textTransform: 'uppercase' }, text: w.site.subtitle })
    ]);
    card.appendChild(head);

    stage = stage || 'pick';
    if (stage === 'pick')  gatePick(card);
    if (stage === 'guest') gateGuest(card);
    if (stage === 'admin') gateAdmin(card);
    if (stage === 'cloud') gateCloud(card);
  }

  function gatePick(card) {
    var cloudOn = S.isCloud();
    card.appendChild(el('p', { class: 'muted', style: { textAlign: 'center', marginBottom: '20px', fontSize: '13.5px' },
      text: '登记你的身份，即可开始浏览陨星岛的一切。' }));

    var btns = el('div', { class: 'col g10' });

    if (cloudOn) {
      btns.appendChild(el('button', { class: 'btn btn-primary btn-lg btn-block',

    }
    btns.appendChild(el('button', { class: 'btn ' + (cloudOn ? 'btn-soft' : 'btn-primary') + ' btn-lg btn-block',
      html: icon('user', 17) + '<span>以访客身份登记</span>', onclick: function () { renderGate('guest'); } }));
    btns.appendChild(el('button', { class: 'btn btn-ghost btn-block',
      html: icon('key', 16) + '<span>管理员模式</span>', onclick: function () { renderGate('admin'); } }));

    card.appendChild(btns);
    card.appendChild(el('div', { class: 'divider' }));
    card.appendChild(el('p', { class: 'muted', style: { fontSize: '11.5px', textAlign: 'center', lineHeight: '1.7' },
      html: cloudOn
        ? '账号数据保存在云端，可跨设备同步。<br>「管理员模式」是用<b>本机密码</b>离线编辑，<b>发布到云端需通过「登录 / 注册账号」用云端管理员账号登录</b>。'
        : '当前为本地模式，数据保存在本机浏览器中。<br>管理员可在管理台配置云端同步。' }));
  }

  function gateGuest(card) {
    var w = S.world();
    var name = el('input', { class: 'input', placeholder: '你的称呼', maxlength: '20' });
    var fac  = el('select', { class: 'select' });
    fac.appendChild(el('option', { value: '', text: '暂不选择组织' }));
    (w.orgs || []).forEach(function (o) { fac.appendChild(el('option', { value: o.key, text: o.name + '（' + o.abbr + '）' })); });
    var bio  = el('textarea', { class: 'textarea', rows: '2', placeholder: '一句话介绍自己（可选）', maxlength: '60' });

    card.appendChild(el('div', { class: 'col g14' }, [
      field('称呼', name, '在广场与档案馆中展示的名字'),
      field('倾向组织', fac),
      field('简介', bio)
    ]));

    var go = el('button', { class: 'btn btn-primary btn-lg btn-block', style: { marginTop: '20px' },
      html: '<span>进入资料站</span>' + icon('chevR', 17),
      onclick: function () {
        var n = name.value.trim();
        if (!n) { U.toast('请填写称呼', 'err'); name.focus(); return; }
        S.setLocalUser({ id: S.uid('u'), name: n, faction: fac.value, bio: bio.value.trim(), avatar: '' });
        S.setMode('guest');
        U.toast('欢迎来到星落城，' + n, 'ok');
        renderShell();
      } });
    card.appendChild(go);
    card.appendChild(backLink());
    name.focus();
    name.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });
  }

  function gateAdmin(card) {
    var w = S.world();
    var first = !w.site.adminHash;

    card.appendChild(el('div', { class: 'notice ' + (first ? '' : 'warn'), style: { marginBottom: '16px' },
      html: icon('shield', 16) + '<div>' + (first
        ? '尚未设置管理口令。<b>第一次进入管理员模式请设置一个口令</b>，之后在任何设备打开本应用都需要它。'
        : '管理员模式可编辑全部内容：组织、时间轴、设定集、题库与档案审核。') + '</div>' }));

    var key  = el('input', { class: 'input', type: 'password', placeholder: first ? '设置管理口令（至少 4 位）' : '输入管理口令' });
    var key2 = first ? el('input', { class: 'input', type: 'password', placeholder: '再次输入以确认' }) : null;
    var name = el('input', { class: 'input', placeholder: '管理员昵称', value: '管理员' });

    var box = el('div', { class: 'col g14' }, [field('管理口令', key)]);
    if (key2) box.appendChild(field('确认口令', key2));
    box.appendChild(field('昵称', name));
    card.appendChild(box);

    var go = el('button', { class: 'btn btn-primary btn-lg btn-block', style: { marginTop: '20px' },
      html: icon('unlock', 17) + '<span>' + (first ? '设置并进入' : '进入管理员模式') + '</span>',
      onclick: function () {
        var k = key.value.trim();
        if (first) {
          if (k.length < 4) { U.toast('口令至少 4 位', 'err'); return; }
          if (k !== key2.value.trim()) { U.toast('两次输入不一致', 'err'); return; }
          S.setAdminKey(k);
        } else if (!S.verifyAdminKey(k)) {
          U.toast('口令不正确', 'err'); key.value = ''; key.focus(); return;
        }
        S.setLocalUser({ id: S.uid('adm'), name: name.value.trim() || '管理员', faction: '', bio: '', avatar: '', role: 'admin' });
        S.setMode('admin');
        U.toast('已进入管理员模式', 'ok');
        renderShell();
      } });
    card.appendChild(go);
    card.appendChild(backLink());
    key.focus();
    key.addEventListener('keydown', function (e) { if (e.key === 'Enter') (key2 || go).focus ? (key2 ? key2.focus() : go.click()) : go.click(); });

  /* 注册时若提供了正确密钥，登录成功后自动提权为管理员 */
  async function tryClaimAdmin() {
    var key = localStorage.getItem('_sf_pending_admin');
    if (!key) return;
    try {
      await S.pull({ force: true }).catch(function () {});
      var curKey = (S.world().site.regKey || '').trim();

        await SF.cloud.claimAdmin(key);
        await SF.cloud.loadProfile();

        U.toast('已自动获得管理员权限', 'ok');

  }

  /* 首次启动引导：讲清本地模式 vs 云端账号，看完打标不再弹 */
  function maybeOnboard() {
    try { if (localStorage.getItem('_sf_onboarded') === '1') return; } catch (e) {}
    var body = el('div', { class: 'col g14' }, [
      el('p', { class: 'muted', text: '这是一个世界观资料站：你可以查阅设定、建立自己的角色档案，也能在广场留言互动。' }),
      el('div', { class: 'notice', html: icon('info', 16) + '<div><b>本地模式</b>：不登录也能浏览设定、在本机建立档案。数据只存在这一台设备。</div>' }),
      el('div', { class: 'notice', html: icon('cloud', 16) + '<div><b>云端账号</b>：注册并登录后，档案、留言、试炼记录会在多设备间同步，也能被其他人看到与互动。</div>' }),
      el('p', { class: 'muted', text: '想开始？点底部「我的」建立第一份档案；想跨设备同步，就点「登录 / 注册账号」。' })
    ]);
    U.modal({ title: '欢迎来到星落城', body: body, buttons: [
      { text: '开始探索', class: 'btn-primary', onclick: function (close) {
        try { localStorage.setItem('_sf_onboarded', '1'); } catch (e) {}
        close();
      } }
    ] });
  }

  function gateCloud(card) {
    var mode = { v: 'in' };
    var body = el('div');
    card.appendChild(body);

    function draw() {
      body.innerHTML = '';
      var seg = el('div', { class: 'seg', style: { marginBottom: '18px' } }, [
        el('button', { class: mode.v === 'in' ? 'on' : '', text: '登录', onclick: function () { mode.v = 'in'; draw(); } }),
        el('button', { class: mode.v === 'up' ? 'on' : '', text: '注册', onclick: function () { mode.v = 'up'; draw(); } })
      ]);
      body.appendChild(seg);

      var email = el('input', { class: 'input', type: 'email', placeholder: 'you@example.com', autocomplete: 'email' });
      var pass  = el('input', { class: 'input', type: 'password', placeholder: '密码（至少 6 位）', autocomplete: 'current-password' });
      var nick  = mode.v === 'up' ? el('input', { class: 'input', placeholder: '你的称呼', maxlength: '20' }) : null;
      var regKeyI = mode.v === 'up' ? el('input', { class: 'input', type: 'password', placeholder: '注册密钥（向管理员索取）' }) : null;

      var f = el('div', { class: 'col g14' }, [field('邮箱', email), field('密码', pass)]);
      if (nick) f.appendChild(field('称呼', nick));
      if (regKeyI) f.appendChild(field('注册密钥', regKeyI));
      body.appendChild(f);

      var go = el('button', { class: 'btn btn-primary btn-lg btn-block', style: { marginTop: '20px' },
        text: mode.v === 'in' ? '登录' : '注册并进入',
        onclick: async function () {
          var e = email.value.trim(), p = pass.value;
          if (!e || !p) { U.toast('请填写邮箱与密码', 'err'); return; }
          go.disabled = true; go.innerHTML = '<span class="spin"></span>处理中';
          try {
            if (mode.v === 'up') {
              /* 注册密钥校验：若站点设置了 regKey，则必须匹配（先拉取最新世界数据确保拿到密钥） */
              var wantKey = (S.world().site.regKey || '').trim();
              if (wantKey) {
                try { await S.pull({ force: true }); } catch (e2) { /* 拉取失败则用本地值 */ }
                var curKey = (S.world().site.regKey || '').trim();
                if (!regKeyI || regKeyI.value.trim() !== curKey) {
                  U.toast('注册密钥不正确', 'err');
                  go.disabled = false; go.textContent = '注册并进入';
                  return;
                }
              }
              if (regKeyI && regKeyI.value.trim() && (S.world().site.regKey || '').trim() === regKeyI.value.trim())
                localStorage.setItem('_sf_pending_admin', regKeyI.value.trim());
              await SF.cloud.auth.signUp(e, p);
              if (!SF.cloud.auth.me()) { U.toast('注册成功，请查收邮件完成验证后登录', 'ok'); mode.v = 'in'; draw(); return; }
              await SF.cloud.upsertProfile({ name: (nick && nick.value.trim()) || e.split('@')[0], role: 'member' });
            } else {
              await SF.cloud.auth.signIn(e, p);
              await SF.cloud.loadProfile();
              if (!SF.cloud.profile) await SF.cloud.upsertProfile({ name: e.split('@')[0], role: 'member' });
            }
            S.setMode(SF.cloud.isAdmin() ? 'admin' : 'guest');
            await S.pull({ force: true }).catch(function () {});
            await tryClaimAdmin().catch(function () {});
            U.toast('欢迎回来', 'ok');
            renderShell();
          } catch (err) {
            U.toast(err.message || '操作失败', 'err');
            go.disabled = false; go.textContent = mode.v === 'in' ? '登录' : '注册并进入';
          }
        } });
      body.appendChild(go);
      pass.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go.click(); });
    }
    draw();
    card.appendChild(backLink());
  }

  function field(label, input, hint) {
    var f = el('div', { class: 'field' }, [el('label', { text: label }), input]);
    if (hint) f.appendChild(el('div', { class: 'hint', text: hint }));
    return f;
  }
  function backLink() {
    return el('div', { style: { textAlign: 'center', marginTop: '16px' } }, [
      el('button', { class: 'btn btn-ghost btn-sm', html: icon('chevL', 15) + '<span>返回</span>',
        onclick: function () { renderGate('pick'); } })
    ]);
  }

  /* ============================================================
     Shell
     ============================================================ */
  var mount, topTitle, topCrumb, modePill;

  var ICON_SUN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M5 19l1.6-1.6M17.4 6.6 19 5"/></svg>';
  var ICON_MOON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function themeBtn() {
    var b = el('button', { class: 'btn btn-ghost btn-icon btn-sm', title: '切换深色 / 浅色模式',
      html: document.documentElement.getAttribute('data-theme') === 'dark' ? ICON_SUN : ICON_MOON,
      onclick: function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('_sf_theme', next); } catch (e) {}
        b.innerHTML = next === 'dark' ? ICON_SUN : ICON_MOON;
      }
    });
    return b;
  }

  function renderShell() {
    var w = S.world();
    APP.innerHTML = '';

    /* --- sidebar --- */
    var side = el('aside', { class: 'sidebar' });
    side.appendChild(el('a', { class: 'brand', href: '#/home' }, [
      el('div', { class: 'brand-mark', html: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/></svg>' }),
      el('div', { class: 'brand-txt' }, [
        el('div', { class: 't', text: w.site.title }),
        el('div', { class: 's', text: w.site.subtitle })
      ])
    ]));
    var nav = el('nav', { class: 'nav' });
    side.appendChild(nav);

    var foot = el('div', { class: 'side-foot' });
    side.appendChild(foot);

    /* --- main --- */
    topTitle = el('h1', { text: '首页' });
    topCrumb = el('div', { class: 'crumb' });
    modePill = el('div', { class: 'mode-pill' });
    function topSearch() {
      var inp = el('input', { class: 'input top-search-input', type: 'search', placeholder: '搜索…', style: { width: '190px' } });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { var v = inp.value.trim(); if (v) R.go(R.url('/search', { q: v })); }
      });
      return el('div', { class: 'top-search-wrap' }, [
        el('span', { class: 'ts-ico', html: icon('search', 16) }), inp
      ]);
    }

    var top = el('header', { class: 'topbar' }, [
      el('div', {}, [topTitle, topCrumb]),
      el('div', { style: { marginLeft: 'auto' }, class: 'row g8' }, [topSearch(), bellBtn(), modePill, syncBtn(), themeBtn()])
    ]);

    var mtop = el('header', { class: 'mtop' }, [
      el('div', { class: 'brand-mark', style: { width: '30px', height: '30px', borderRadius: '9px' },
        html: '<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px"><path d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z"/></svg>' }),
      el('div', { style: { fontSize: '15px', fontWeight: '700' }, id: 'mTitle', text: w.site.title }),
      el('div', { style: { marginLeft: 'auto' }, class: 'row g6' }, [
        el('button', { class: 'btn btn-ghost btn-icon btn-sm', title: '搜索', html: icon('search', 18), onclick: function () { R.go('/search'); } }),
        bellBtn(),
        el('button', { class: 'btn btn-ghost btn-icon btn-sm', html: icon('grip', 18), onclick: openDrawer })
      ])
    ]);

    mount = el('div', { class: 'page' });
    var main = el('main', { class: 'main' }, [top, mtop, mount]);

    /* --- tabbar --- */
    var tabInner = el('div', { class: 'inner' });
    TABS.forEach(function (t) {
      tabInner.appendChild(el('a', { class: 'tab', href: '#/' + t.name, 'data-tab': t.name,
        html: icon(t.icon, 21) + '<span>' + esc(t.label) + '</span>' }));
    });
    var tabbar = el('nav', { class: 'tabbar' }, [tabInner]);

    APP.appendChild(side); APP.appendChild(main); APP.appendChild(tabbar);

    drawNav(nav, foot);

    // 顶栏阴影
    window.addEventListener('scroll', function () {
      top.classList.toggle('stuck', window.scrollY > 4);
    }, { passive: true });

    registerRoutes();
    R.start(function () { R.go('/home', true); });

    // 数据变化时刷新导航徽标
    S.on('world', function () { drawNav(nav, foot); paintMode(); });
    S.on('mode', function () { drawNav(nav, foot); paintMode(); });
    paintMode();
  }

  function drawNav(nav, foot) {
    var admin = S.isAdmin();
    var st = S.stats();
    nav.innerHTML = '';
    NAV.forEach(function (g) {
      var items = g.items.filter(function (i) { return !i.adminOnly || admin; });
      if (!items.length) return;
      nav.appendChild(el('div', { class: 'nav-label', text: g.group }));
      items.forEach(function (i) {
        var a = el('a', { class: 'nav-item', href: '#/' + i.name, 'data-nav': i.name,
          html: icon(i.icon, 18) + '<span>' + esc(i.label) + '</span>' });
        if (i.name === 'admin' && st.pending) a.appendChild(el('span', { class: 'badge badge-warn', text: String(st.pending) }));
        nav.appendChild(a);
      });
    });

    var u = S.currentUser() || { name: '未登记' };
    foot.innerHTML = '';
    foot.appendChild(el('a', { class: 'who', href: '#/me' }, [
      avatarEl(u, 32),
      el('div', { style: { minWidth: 0 } }, [
        el('div', { class: 'n clamp-1', text: u.name }),
        el('div', { class: 'r', text: admin ? '管理员' : (S.isCloud() ? '云端账号' : '本地访客') })
      ])
    ]));
    highlight();
  }

  function avatarEl(u, size) {
    var s = size || 34;
    if (u.avatar) return el('img', { class: 'avatar', src: u.avatar, style: { width: s + 'px', height: s + 'px' } });
    var ch = (u.name || '?').trim().charAt(0);
    var org = u.faction ? SF.factionOf(u.faction) : null;
    return el('div', { class: 'avatar', text: ch,
      style: { width: s + 'px', height: s + 'px', fontSize: Math.round(s * .42) + 'px',
               background: org ? org.color + '1f' : 'var(--primary-bg)',
               color: org ? org.color : 'var(--primary-ink)' } });
  }

  function syncBtn() {
    if (!S.isCloud()) return el('span');
    var b = el('button', { class: 'btn btn-ghost btn-sm' });
    if (S.isCloudAdmin()) {
      b.innerHTML = icon('upload', 15) + '<span>发布</span>';
      b.title = '以云端管理员身份发布到 Supabase';
      b.onclick = async function () {
        b.disabled = true;
        try { await S.push(); U.toast('已发布到云端', 'ok'); }
        catch (e) { U.toast(e.message || '同步失败', 'err'); }
        b.disabled = false;
      };
    } else if (S.isAdmin()) {
      // 本地管理员模式（未登录云端账号）→ 不能发布，明确提示
      b.innerHTML = icon('lock', 15) + '<span>需云端管理员登录</span>';
      b.title = '当前是本地管理员模式，发布到云端需先以云端管理员账号登录';
      b.onclick = function () { U.toast('请先通过「登录 / 注册账号」用云端管理员账号登录，再发布', 'info'); };
    } else {
      b.innerHTML = icon('refresh', 15) + '<span>同步</span>';
      b.onclick = async function () {
        b.disabled = true;
        try { await S.pull({ force: true }); U.toast('已获取最新内容', 'ok'); R.resolve(); }
        catch (e) { U.toast(e.message || '同步失败', 'err'); }
        b.disabled = false;
      };
    }
    return b;
  }

  function paintMode() {
    if (!modePill) return;
    var admin = S.isAdmin();
    modePill.className = 'mode-pill ' + (admin ? 'admin' : '');
    modePill.innerHTML = icon(admin ? 'unlock' : 'eye', 14) + '<span>' + (admin ? '管理员模式' : '只读浏览') + '</span>';
    modePill.title = admin ? '点击退出管理员模式' : '点击切换到管理员模式';
    modePill.style.cursor = 'pointer';
    modePill.onclick = toggleMode;
  }

  async function toggleMode() {
    if (S.isAdmin()) {
      var ok = await U.confirm({ title: '退出管理员模式', message: '退出后将以只读身份浏览，内容不会丢失。' });
      if (!ok) return;
      if (S.isCloud() && SF.cloud.profile) { U.toast('云端账号的权限由管理员分配，无法本地切换', 'info'); return; }
      S.setMode('guest');
      var u = S.currentUser(); if (u) S.setLocalUser(Object.assign({}, u, { role: 'member' }));
      U.toast('已切换为只读浏览', 'ok');
      renderShell();
    } else {
      if (S.isCloud() && SF.cloud.profile) { U.toast('请使用管理员账号登录', 'info'); return; }
      var w = S.world();
      if (!w.site.adminHash) { renderGate('admin'); return; }
      var r = await U.formModal({
        title: '进入管理员模式', okText: '验证',
        fields: [{ name: 'key', label: '管理口令', type: 'password', required: true, placeholder: '输入管理口令' }]
      });
      if (!r) return;
      if (!S.verifyAdminKey(r.key)) { U.toast('口令不正确', 'err'); return; }
      S.setMode('admin');
      var cu = S.currentUser(); if (cu) S.setLocalUser(Object.assign({}, cu, { role: 'admin' }));
      U.toast('已进入管理员模式', 'ok');
      renderShell();
    }
  }

  /* 移动端抽屉：完整导航 */
  function openDrawer() {
    var admin = S.isAdmin();
    var mask = el('div', { class: 'drawer-mask', onclick: close });
    var box = el('div', { class: 'drawer' }, [el('div', { class: 'grip' })]);
    NAV.forEach(function (g) {
      var items = g.items.filter(function (i) { return !i.adminOnly || admin; });
      if (!items.length) return;
      box.appendChild(el('div', { class: 'nav-label', text: g.group }));
      items.forEach(function (i) {
        box.appendChild(el('a', { class: 'nav-item', href: '#/' + i.name,
          html: icon(i.icon, 18) + '<span>' + esc(i.label) + '</span>', onclick: close }));
      });
    });
    box.appendChild(el('div', { class: 'divider' }));
    box.appendChild(el('button', { class: 'btn btn-soft btn-block',
      html: icon(admin ? 'unlock' : 'eye', 16) + '<span>' + (admin ? '管理员模式' : '只读浏览') + '</span>',
      onclick: function () { close(); toggleMode(); } }));
    document.body.appendChild(mask); document.body.appendChild(box);
    document.body.style.overflow = 'hidden';
    function close() { mask.remove(); box.remove(); document.body.style.overflow = ''; }
  }

  /* ============================================================
     路由
     ============================================================ */
  function registerRoutes() {
    ['home', 'orgs', 'timeline', 'codex', 'archives', 'trial', 'square', 'search', 'notices', 'me', 'admin'].forEach(function (n) {
      R.on(n, function (ctx) {
        if (n === 'admin' && !S.isAdmin()) { U.toast('需要管理员权限', 'err'); R.go('/home', true); return; }
        var page = SF.pages && SF.pages[n];
        mount.innerHTML = '';
        if (!page) { mount.appendChild(el('div', { class: 'empty' }, [el('div', { class: 'i', html: icon('alert', 26) }), el('p', { text: '模块「' + n + '」尚未加载' })])); return; }
        page.render(mount, ctx);
        window.scrollTo(0, 0);
      });
    });

    R.after(function (ctx) {
      var t = TITLES[ctx.name] || '首页';
      if (topTitle) topTitle.textContent = t;
      var mt = document.getElementById('mTitle'); if (mt) mt.textContent = t;
      document.title = t + ' · ' + S.world().site.title;
      if (topCrumb) topCrumb.textContent = '';
      highlight();
    });
  }

  function setCrumb(text) { if (topCrumb) topCrumb.textContent = text || ''; }
  function setTitle(text) {
    if (topTitle) topTitle.textContent = text;
    var mt = document.getElementById('mTitle'); if (mt) mt.textContent = text;
  }

  function highlight() {
    var n = R.current.name || 'home';
    U.$$('[data-nav]').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-nav') === n); });
    U.$$('[data-tab]').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-tab') === n); });
  }

  /* 供各模块调用的共享方法 */
  SF.app = {
    renderShell, renderGate, setCrumb, setTitle, avatarEl, field,
    toggleMode, boot, refreshBell,
    logout: async function () {
      var ok = await U.confirm({ title: '退出登录', message: '确定要退出当前身份吗？本机数据不会被删除。', danger: true, okText: '退出' });
      if (!ok) return;
      if (S.isCloud()) { try { await SF.cloud.auth.signOut(); } catch (e) {} }
      S.setLocalUser(null);
      S.setMode('guest');
      renderGate();
    }
  };

  /* PWA */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') boot();
})(window.SF);

</script>
</body>
</html>
